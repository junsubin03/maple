<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>반복 타이머</title>
<style>
select{padding:11px 14px;border:1px solid #444;border-radius:10px;background:#333;color:#fff;font-size:14px;min-width:180px}
.choice-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.section-title{font-size:18px;font-weight:800;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #292b31}
.sub{font-size:12px;color:#888;font-weight:400}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.toggle{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-weight:700;cursor:pointer}
.toggle input{width:auto;accent-color:#fff}
.small-btn{padding:9px 14px;font-size:14px}
.panel>label{font-weight:600;color:#ddd}
.panel select{width:100%;margin-top:8px}
.volume-row{display:grid;grid-template-columns:auto 1fr 48px;align-items:center;gap:10px;margin:13px 0 4px;padding:11px 12px;border:1px solid #292b31;border-radius:11px;background:#101216;color:#bbb;font-size:13px}
.volume-row input[type=range]{width:100%;accent-color:#fff}
.volume-row output{text-align:right;color:#fff;font-variant-numeric:tabular-nums}
.choice{display:flex;align-items:center;gap:8px;padding:11px 13px;border:1px solid #303238;border-radius:11px;background:#101216;color:#ddd;font-size:14px;cursor:pointer;transition:.15s}
.choice:has(input:checked){border-color:#777;background:#25282e;color:#fff;box-shadow:inset 0 0 0 1px #555}
.choice input{width:auto;accent-color:#fff}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c0f;color:#f5f5f5;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{text-align:center;width:min(92vw,620px);padding:32px 0}h1{font-size:28px;margin:0 0 24px}
#time{font-size:clamp(90px,24vw,170px);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}

.interval-card{margin:0 auto 24px;padding:16px;border:1px solid #292b31;border-radius:16px;background:#15171b;text-align:left}
.interval-title{font-weight:800;margin-bottom:12px}
.interval-inputs{display:flex;align-items:center;gap:8px}.interval-inputs>div{display:flex;align-items:center;gap:6px}
.interval-inputs input{width:78px;text-align:center}.interval-inputs span{color:#999;font-size:13px}
.interval-presets{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}.interval-presets button{padding:8px 12px;font-size:13px;background:#24272d;color:#ddd}
.status{height:28px;margin:18px 0;color:#aaa}.buttons,.tts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
button{border:0;border-radius:12px;padding:13px 21px;font-size:16px;font-weight:700;cursor:pointer;background:#fff;color:#111}
button.secondary{background:#333;color:#fff}button:active{transform:scale(.97)}
.panel{margin-top:28px;padding:24px;border:1px solid #292b31;border-radius:20px;text-align:left;background:#15171b;box-shadow:0 12px 35px rgba(0,0,0,.25)}
label{display:block;color:#aaa;font-size:13px;margin-bottom:8px}input{width:100%;padding:12px;border:1px solid #444;border-radius:10px;background:#111;color:#fff;font-size:16px}
.tts{margin-top:12px}.tts button{font-size:14px;padding:11px 16px}.hint{margin-top:18px;color:#777;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<h1>반복 타이머</h1>
<div class="interval-card">
  <div class="interval-title">⏱️ 반복 시간</div>
  <div class="interval-inputs">
    <div><input id="minutesInput" type="number" min="0" max="999" value="1"><span>분</span></div>
    <div><input id="secondsInput" type="number" min="0" max="59" value="0"><span>초</span></div>
    <button id="applyInterval" class="small-btn">적용</button>
  </div>
  <div class="interval-presets">
    <button data-sec="30">30초</button><button data-sec="60">1분</button>
    <button data-sec="180">3분</button><button data-sec="300">5분</button>
    <button data-sec="600">10분</button>
  </div>
</div>
<div id="time">1:00</div>
<div class="status" id="status">대기 중</div>
<div class="buttons">
<button id="start">시작</button><button id="pause" class="secondary">일시정지</button><button id="reset" class="secondary">초기화</button><button id="pip" class="secondary">🖼️ PIP</button>
</div>

<div class="panel">
  <div class="section-title">🔊 TTS 설정</div>
  <div class="toggle-row">
    <label class="toggle"><input id="ttsEnabled" type="checkbox" checked><span>사용</span></label>
    <button id="preview" class="small-btn">▶ 미리듣기</button>
  </div>
  <label for="ttsText">읽을 문구</label>
  <input id="ttsText" value="야누스가 꺼집니다">
  <div class="volume-row">
    <span>🔊 TTS 볼륨</span>
    <input id="ttsVolume" type="range" min="0" max="100" value="100">
    <output id="ttsVolumeValue">100%</output>
  </div>

  <label style="margin-top:16px">목소리 선택 <span class="sub">복수 선택 가능</span></label>
  <div id="voiceList" class="choice-list"></div>

  <div class="section-title" style="margin-top:24px">🎵 효과음 설정</div>
  <div class="toggle-row">
    <label class="toggle"><input id="soundEnabled" type="checkbox" checked><span>사용</span></label>
    <button id="soundPreview" class="small-btn">▶ 미리듣기</button>
  </div>
  <label for="soundSelect">효과음 선택 <span class="sub">1개만 선택</span></label>
  <div class="volume-row">
    <span>🔊 효과음 볼륨</span>
    <input id="soundVolume" type="range" min="0" max="100" value="70">
    <output id="soundVolumeValue">70%</output>
  </div>
  <select id="soundSelect" aria-label="효과음 선택">
    <option value="ding" selected>🔔 띵 — 기본 알림</option>
    <option value="double">🔔 띵띵 — 두 번 알림</option>
    <option value="bell">🛎️ 종소리 — 길게</option>
    <option value="beep">📟 삐 — 짧고 선명하게</option>
    <option value="chime">✨ 차임 — 부드럽게</option>
    <option value="triple">🔔 띵띵띵 — 세 번 알림</option>
    <option value="alert">🚨 알림음 — 주의 환기</option>
    <option value="siren">🚨 사이렌 — 상승/하강 경보</option>
    <option value="alarm">⏰ 경보음 — 긴급 알림</option>
    <option value="warning">⚠️ 경고음 — 빠른 반복</option>
    <option value="iphoneAlarm">📱 스마트폰 경보음 — 아이폰 느낌</option>
  </select>
</div>
<div class="hint">설정한 시간이 끝나면 선택한 TTS와 효과음을 재생하고 자동으로 다시 반복합니다.</div>
</div>

<script>
let intervalSeconds=60,remaining=60,running=false,timer=null;
const timeEl=document.getElementById('time'),statusEl=document.getElementById('status'),textEl=document.getElementById('ttsText');

function render(){timeEl.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;updatePip()}

function speak(){
  if(!document.getElementById('ttsEnabled').checked) return;
  if(!('speechSynthesis' in window)){statusEl.textContent='이 브라우저는 TTS를 지원하지 않습니다.';return}
  const voices=getSelectedVoices();
  if(!voices.length){statusEl.textContent='TTS 목소리를 하나 이상 선택해 주세요.';return}
  speechSynthesis.cancel();
  const text=textEl.value || '야누스가 꺼집니다';
  voices.forEach(voice=>{
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voice;u.lang=voice.lang;u.rate=1;u.pitch=1;u.volume=Number(document.getElementById('ttsVolume').value)/100;
    speechSynthesis.speak(u);
  });
}

function playSound(type){
  try{
    const C=window.AudioContext||window.webkitAudioContext;
    const ctx=new C();
    const tone=(freq,start,duration,wave='sine',volume=.8)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type=wave;o.frequency.value=freq;o.connect(g);g.connect(ctx.destination);
      g.gain.setValueAtTime(0,start);
      g.gain.linearRampToValueAtTime(.075*volume*(Number(document.getElementById('soundVolume')?.value||70)/100),start+.01);
      g.gain.exponentialRampToValueAtTime(.001,start+duration);
      o.start(start);o.stop(start+duration+.02);
    };
    const t=ctx.currentTime;
    if(type==='ding'){
      tone(880,t,.5,'sine',1); tone(1320,t+.08,.55,'sine',.8);
    }else if(type==='double'){
      tone(880,t,.28,'sine',1); tone(880,t+.34,.28,'sine',1);
    }else if(type==='bell'){
      tone(660,t,.8,'sine',1); tone(990,t+.04,1,'sine',.65); tone(1320,t+.1,1.2,'sine',.4);
    }else if(type==='beep'){
      tone(1000,t,.18,'square',.8); tone(1000,t+.23,.18,'square',.8);
    }else if(type==='chime'){
      tone(523.25,t,.8,'sine',.8); tone(659.25,t+.08,.9,'sine',.7);
      tone(783.99,t+.16,1.1,'sine',.6); tone(1046.5,t+.24,1.3,'sine',.45);
    }else if(type==='triple'){
      tone(880,t,.22,'sine',1); tone(880,t+.28,.22,'sine',1); tone(1320,t+.56,.4,'sine',.9);
    }else if(type==='alert'){
      tone(740,t,.22,'square',.75); tone(980,t+.24,.22,'square',.75);
      tone(740,t+.48,.22,'square',.75); tone(980,t+.72,.35,'square',.75);
    }else if(type==='siren'){
      tone(620,t,.28,'sawtooth',.8); tone(920,t+.28,.28,'sawtooth',.8);
      tone(620,t+.56,.28,'sawtooth',.8); tone(920,t+.84,.38,'sawtooth',.8);
    }else if(type==='alarm'){
      tone(880,t,.18,'square',.9); tone(660,t+.2,.18,'square',.9);
      tone(880,t+.4,.18,'square',.9); tone(660,t+.6,.28,'square',.9);
    }else if(type==='warning'){
      tone(1050,t,.12,'square',.8); tone(1050,t+.16,.12,'square',.8);
      tone(780,t+.36,.16,'square',.8); tone(1050,t+.58,.18,'square',.8);
    }else if(type==='iphoneAlarm'){
      // Original synthesized smartphone-style rising/falling alert.
      tone(650,t,.35,'sine',.85); tone(1150,t+.35,.35,'sine',.9);
      tone(650,t+.72,.35,'sine',.85); tone(1150,t+1.07,.35,'sine',.9);
      tone(650,t+1.45,.35,'sine',.85); tone(1150,t+1.80,.5,'sine',.9);
    }
    setTimeout(()=>ctx.close(),2200);
  }catch(e){}
}
function tick(){
  remaining--;
  if(remaining<=0){
    remaining=intervalSeconds;
    const soundEnabled=document.getElementById('soundEnabled').checked;
    if(soundEnabled) playSound(document.getElementById('soundSelect').value);
    if(document.getElementById('ttsEnabled').checked) speak();
    statusEl.textContent='1분 완료';
  }
  render();
}
function setIntervalTime(total){
  total=Math.max(1,Math.min(59999,total));
  intervalSeconds=total; remaining=total;
  document.getElementById('minutesInput').value=Math.floor(total/60);
  document.getElementById('secondsInput').value=total%60;
  statusEl.textContent=`반복 간격 ${Math.floor(total/60)}분 ${total%60}초`;
  render();
}
document.getElementById('applyInterval').onclick=()=>{
  const m=Math.max(0,Math.min(999,Number(document.getElementById('minutesInput').value)||0));
  const s=Math.max(0,Math.min(59,Number(document.getElementById('secondsInput').value)||0));
  const total=m*60+s;
  if(total<1){statusEl.textContent='1초 이상 입력해 주세요.';return}
  setIntervalTime(total);
};
document.querySelectorAll('.interval-presets button').forEach(b=>b.onclick=()=>setIntervalTime(Number(b.dataset.sec)));

document.getElementById('start').onclick=()=>{
  if(running)return;
  running=true;statusEl.textContent='실행 중';timer=setInterval(tick,1000);
};
document.getElementById('pause').onclick=()=>{
  if(!running)return;
  running=false;clearInterval(timer);statusEl.textContent='일시정지';speechSynthesis.cancel();
};
document.getElementById('reset').onclick=()=>{
  running=false;clearInterval(timer);remaining=intervalSeconds;speechSynthesis.cancel();statusEl.textContent='대기 중';render();
};
const voiceList=document.getElementById('voiceList');
let availableVoices=[];

function loadVoices(){
  if(!('speechSynthesis' in window)){
    voiceList.innerHTML='<div style="color:#aaa;font-size:13px">이 브라우저는 TTS를 지원하지 않습니다.</div>';
    return;
  }
  availableVoices=speechSynthesis.getVoices()
    .filter(v=>v.lang.toLowerCase().startsWith('ko'))
    .sort((a,b)=>a.name.localeCompare(b.name));

  voiceList.innerHTML='';
  if(!availableVoices.length){
    voiceList.innerHTML='<div style="color:#aaa;font-size:13px">한국어 음성이 없습니다. OS의 음성 기능을 확인해 주세요.</div>';
    return;
  }
  availableVoices.forEach((v,i)=>{
    const label=document.createElement('label');
    label.className='choice';
    label.innerHTML=`<input type="checkbox" value="${i}"> 🗣️ ${v.name} (${v.lang})`;
    voiceList.appendChild(label);
  });
  const first=voiceList.querySelector('input');
  if(first) first.checked=true;
}

function getSelectedVoices(){
  return [...voiceList.querySelectorAll('input:checked')]
    .map(x=>availableVoices[Number(x.value)]).filter(Boolean);
}

function speak(){
  if(!('speechSynthesis' in window)){statusEl.textContent='이 브라우저는 TTS를 지원하지 않습니다.';return}
  const voices=getSelectedVoices();
  if(!voices.length){statusEl.textContent='TTS 목소리를 하나 이상 선택해 주세요.';return}
  speechSynthesis.cancel();
  const text=textEl.value || '야누스가 꺼집니다';
  voices.forEach((voice,index)=>{
    const u=new SpeechSynthesisUtterance(text);
    u.voice=voice;u.lang=voice.lang;u.rate=1;u.pitch=1;u.volume=Number(document.getElementById('ttsVolume').value)/100;
    // 복수 선택 시 선택한 목소리가 순서대로 모두 재생됩니다.
    if(index>0) u.text=text;
    speechSynthesis.speak(u);
  });
}

document.getElementById('preview').onclick=()=>speak();
document.getElementById('soundPreview').onclick=()=>{
  if(!document.getElementById('soundEnabled').checked){statusEl.textContent='효과음이 꺼져 있습니다.';return}
  playSound(document.getElementById('soundSelect').value);
};

document.getElementById('ttsVolume').oninput=e=>document.getElementById('ttsVolumeValue').textContent=e.target.value+'%';
document.getElementById('soundVolume').oninput=e=>document.getElementById('soundVolumeValue').textContent=e.target.value+'%';


// Picture-in-Picture
let pipWindow=null;

function updatePip(){
  if(!pipWindow || pipWindow.closed) return;
  const pipTime=pipWindow.document.getElementById('pipTime');
  const pipStatus=pipWindow.document.getElementById('pipStatus');
  const pipStart=pipWindow.document.getElementById('pipStart');
  const pipPause=pipWindow.document.getElementById('pipPause');
  if(pipTime) pipTime.textContent=`${Math.floor(remaining/60)}:${String(remaining%60).padStart(2,'0')}`;
  if(pipStatus) pipStatus.textContent=statusEl.textContent;
  if(pipStart) pipStart.disabled=running;
  if(pipPause) pipPause.disabled=!running;
}

async function openPip(){
  if(!('documentPictureInPicture' in window)){
    statusEl.textContent='이 브라우저에서는 PIP를 지원하지 않습니다. Chrome 116 이상을 사용해 주세요.';
    return;
  }
  if(pipWindow && !pipWindow.closed){
    pipWindow.focus();
    return;
  }

  try{
    pipWindow=await documentPictureInPicture.requestWindow({width:320,height:190});

    const d=pipWindow.document;
    d.body.innerHTML=`
      <style>
        *{box-sizing:border-box}
        body{margin:0;background:#0b0c0f;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
             display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;overflow:hidden}
        #pipTime{font-size:64px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
        #pipStatus{font-size:12px;color:#aaa;height:18px;margin:8px 0}
        .pipBtns{display:flex;gap:6px}
        button{border:0;border-radius:8px;padding:7px 12px;font-weight:700;cursor:pointer;background:#fff;color:#111}
        button.secondary{background:#333;color:#fff}
        button:disabled{opacity:.45;cursor:default}
      </style>
      <div id="pipTime">--:--</div>
      <div id="pipStatus">대기 중</div>
      <div class="pipBtns">
        <button id="pipStart">시작</button>
        <button id="pipPause" class="secondary">일시정지</button>
        <button id="pipReset" class="secondary">초기화</button>
      </div>
    `;

    d.getElementById('pipStart').onclick=()=>document.getElementById('start').click();
    d.getElementById('pipPause').onclick=()=>document.getElementById('pause').click();
    d.getElementById('pipReset').onclick=()=>document.getElementById('reset').click();

    pipWindow.addEventListener('pagehide',()=>{
      pipWindow=null;
    });

    updatePip();
  }catch(e){
    pipWindow=null;
    statusEl.textContent='PIP 창을 열지 못했습니다.';
  }
}

document.getElementById('pip').onclick=openPip;

if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged=loadVoices;
}
render();
</script>
</body>
</html>
